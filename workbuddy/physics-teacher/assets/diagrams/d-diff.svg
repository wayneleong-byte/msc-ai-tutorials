<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker></defs><rect width="1200" height="330" fill="#fbfcfd"/><text x="600.0" y="37.7" font-size="22" font-weight="700" fill="#1f2d3d" text-anchor="middle">從「給建議」到「交付成果」</text><rect x="30" y="70" width="520" height="230" rx="14" fill="#f1f3f5" stroke="#6c757d" stroke-width="2.5"/><text x="290.0" y="153.2" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">聊天機器人</text><text x="290.0" y="178.8" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">你問 → 它答（一段文字）</text><text x="290.0" y="204.5" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">你自己複製、排版、存檔</text><text x="290.0" y="230.1" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">看不到你電腦上的檔案</text><rect x="650" y="70" width="520" height="230" rx="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/><text x="910.0" y="153.2" font-size="19" font-weight="700" fill="#1f2d3d" text-anchor="middle">WorkBuddy（Agent）</text><text x="910.0" y="178.8" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">你交代 → 它規劃步驟 → 執行</text><text x="910.0" y="204.5" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">直接讀寫工作空間的 Word／Excel／PDF</text><text x="910.0" y="230.1" font-size="19" font-weight="400" fill="#1f2d3d" text-anchor="middle">交付檔案，並列出「產物」和「變更」</text><line x1="560" y1="185" x2="640" y2="185" stroke="#55606e" stroke-width="2.5" marker-end="url(#ah)"/></svg>