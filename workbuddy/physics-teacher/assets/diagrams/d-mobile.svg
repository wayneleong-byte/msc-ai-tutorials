<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker></defs><rect width="1200" height="270" fill="#fbfcfd"/><text x="600.0" y="37.7" font-size="22" font-weight="700" fill="#1f2d3d" text-anchor="middle">手機的兩種用法</text><rect x="30" y="60" width="520" height="180" rx="14" fill="#eaf2fc" stroke="#2f6fb3" stroke-width="2.5"/><text x="290.0" y="119.8" font-size="18" font-weight="700" fill="#1f2d3d" text-anchor="middle">雲端工作</text><text x="290.0" y="144.2" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="middle">手機 App／小程序自己做</text><text x="290.0" y="168.5" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="middle">電腦關機也可用</text><text x="290.0" y="192.8" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="middle">檔案在雲端</text><rect x="650" y="60" width="520" height="180" rx="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/><text x="910.0" y="119.8" font-size="18" font-weight="700" fill="#1f2d3d" text-anchor="middle">連接電腦</text><text x="910.0" y="144.2" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="middle">手機發指令 → 電腦上的 WorkBuddy 執行</text><text x="910.0" y="168.5" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="middle">可用電腦工作空間的檔案</text><text x="910.0" y="192.8" font-size="18" font-weight="400" fill="#1f2d3d" text-anchor="middle">電腦要開機、已登入同一微信帳號</text></svg>