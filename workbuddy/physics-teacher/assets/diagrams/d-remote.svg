<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker></defs><rect width="1200" height="230" fill="#fbfcfd"/><text x="600.0" y="37.7" font-size="22" font-weight="700" fill="#1f2d3d" text-anchor="middle">微信助理遙控流程（本機未綁定）</text><rect x="20.0" y="60" width="255.5" height="140" rx="14" fill="#eaf2fc" stroke="#2f6fb3" stroke-width="2.5"/><text x="147.75" y="113.0" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">手機微信</text><text x="147.75" y="135.9" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">對「WorkBuddy 助理」說：</text><text x="147.75" y="158.9" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">把通告改成 80 字群訊息</text><line x1="279.5" y1="130.0" x2="317.5" y2="130.0" stroke="#55606e" stroke-width="2.5" marker-end="url(#ah)"/><rect x="321.5" y="60" width="255.5" height="140" rx="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/><text x="449.25" y="113.0" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">電腦上的</text><text x="449.25" y="135.9" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">WorkBuddy「助理」</text><text x="449.25" y="158.9" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">在專屬資料夾執行</text><line x1="581.0" y1="130.0" x2="619.0" y2="130.0" stroke="#55606e" stroke-width="2.5" marker-end="url(#ah)"/><rect x="623.0" y="60" width="255.5" height="140" rx="14" fill="#fff6d8" stroke="#c99a00" stroke-width="2.5"/><text x="750.75" y="124.5" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">結果回傳</text><text x="750.75" y="147.4" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">微信對話</text><line x1="882.5" y1="130.0" x2="920.5" y2="130.0" stroke="#55606e" stroke-width="2.5" marker-end="url(#ah)"/><rect x="924.5" y="60" width="255.5" height="140" rx="14" fill="#fde8e6" stroke="#c0392b" stroke-width="2.5"/><text x="1052.25" y="124.5" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">你核對後</text><text x="1052.25" y="147.4" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">才轉發到家長群</text></svg>