<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#55606e"/></marker></defs><rect width="1200" height="300" fill="#fbfcfd"/><rect x="470" y="50" width="260" height="70" rx="14" fill="#fff6d8" stroke="#c99a00" stroke-width="2.5"/><text x="600.0" y="91.3" font-size="18" font-weight="700" fill="#1f2d3d" text-anchor="middle">這次要它改檔案嗎？</text><line x1="560" y1="120" x2="220" y2="180" stroke="#55606e" stroke-width="2.5" marker-end="url(#ah)"/><text x="390.0" y="142.9" font-size="14" font-weight="400" fill="#3d4752" text-anchor="middle">不用，只想問</text><line x1="600" y1="120" x2="600" y2="180" stroke="#55606e" stroke-width="2.5" marker-end="url(#ah)"/><text x="600.0" y="142.9" font-size="14" font-weight="400" fill="#3d4752" text-anchor="middle">要，任務簡單</text><line x1="640" y1="120" x2="980" y2="180" stroke="#55606e" stroke-width="2.5" marker-end="url(#ah)"/><text x="810.0" y="142.9" font-size="14" font-weight="400" fill="#3d4752" text-anchor="middle">要，任務大／有風險</text><rect x="60" y="185" width="320" height="90" rx="14" fill="#eaf2fc" stroke="#2f6fb3" stroke-width="2.5"/><text x="220.0" y="224.5" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">[仅问答] Ask</text><text x="220.0" y="247.4" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">只回答，不建檔</text><rect x="440" y="185" width="320" height="90" rx="14" fill="#e6f4ea" stroke="#2e8b57" stroke-width="2.5"/><text x="600.0" y="224.5" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">預設（兩者都關）</text><text x="600.0" y="247.4" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">直接執行、交付檔案</text><rect x="820" y="185" width="320" height="90" rx="14" fill="#efeafd" stroke="#6a4fc7" stroke-width="2.5"/><text x="980.0" y="224.5" font-size="17" font-weight="700" fill="#1f2d3d" text-anchor="middle">[计划] Plan</text><text x="980.0" y="247.4" font-size="17" font-weight="400" fill="#1f2d3d" text-anchor="middle">先出方案，確認才執行</text></svg>