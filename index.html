<!DOCTYPE html>
<html lang="zh-Hant-MO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>澳門科學館 AI 教學工具教程</title>
<style>
:root{--bg:#0f3d3e;--accent:#1a9e8f;--card:#fff;--text:#1a1a1a;--muted:#5a6a6a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#0f3d3e 0%,#1a5c5e 50%,#0d2f30 100%);min-height:100vh;color:var(--text)}
.wrap{max-width:960px;margin:0 auto;padding:48px 24px 80px}
header{text-align:center;color:#fff;margin-bottom:48px}
header h1{font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;letter-spacing:.02em}
header p{margin-top:12px;opacity:.85;font-size:1.05rem}
.badge{display:inline-block;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:999px;font-size:.85rem;margin-bottom:16px}
.grid{display:grid;gap:20px}
.card{background:var(--card);border-radius:16px;padding:28px 32px;box-shadow:0 8px 32px rgba(0,0,0,.18);transition:transform .2s,box-shadow .2s;text-decoration:none;color:inherit;display:block}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.card h2{font-size:1.35rem;color:var(--bg);margin-bottom:8px}
.card .tag{display:inline-block;background:#e6f5f3;color:var(--accent);font-size:.8rem;padding:3px 10px;border-radius:6px;margin-bottom:10px}
.card p{color:var(--muted);line-height:1.6;font-size:.95rem}
.card .arrow{margin-top:14px;color:var(--accent);font-weight:600;font-size:.9rem}
footer{text-align:center;color:rgba(255,255,255,.7);margin-top:56px;font-size:.9rem;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="badge">澳門科學館 · AI 教學工具</div>
  <h1>AI 教學工具教程總目錄</h1>
  <p>為澳門教師及澳門科學館同工而設的實操教學</p>
</header>
<div class="grid">
  <a class="card" href="./brisk-teaching/">
    <span class="tag">Chrome 擴充功能 · Google 文件</span>
    <h2>Brisk Teaching</h2>
    <p>在 Google 文件內直接建立教案、測驗、簡報、回饋與學生活動。本系列以澳門初中中文為示範。</p>
    <div class="arrow">進入教程 →</div>
  </a>
</div>
<footer>
  澳門科學館 Oscar 製作<br>
  2026年10月
</footer>
</div>
</body>
</html>
